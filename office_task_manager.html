
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{padding:1rem;max-width:100%;min-height:600px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);position:relative;transition:all .15s}
.tab.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}
.tab .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:#E24B4A;border-radius:50%;display:none}
.tab .dot.show{display:block}
.btn{padding:7px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:13px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);display:flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{background:var(--color-background-secondary)}
.btn.primary{background:#185FA5;color:#fff;border-color:#185FA5}
.btn.primary:hover{background:#0C447C}
.btn.danger{color:#E24B4A;border-color:#F0959580}
.btn.danger:hover{background:#FCEBEB}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem 1rem}
.stat-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.stat-val.red{color:#E24B4A}
.stat-val.amber{color:#BA7517}
.stat-val.green{color:#3B6D11}
.task-list{display:flex;flex-direction:column;gap:10px}
.task-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;cursor:pointer;transition:border-color .15s}
.task-card:hover{border-color:var(--color-border-primary)}
.task-card.overdue{border-left:3px solid #E24B4A}
.task-card.inprogress{border-left:3px solid #BA7517}
.task-card.done{border-left:3px solid #3B6D11;opacity:.75}
.task-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.task-title{font-size:14px;font-weight:500;color:var(--color-text-primary);flex:1}
.task-title.done-txt{text-decoration:line-through;color:var(--color-text-secondary)}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.badge.overdue{background:#FCEBEB;color:#A32D2D}
.badge.inprogress{background:#FAEEDA;color:#854F0B}
.badge.done{background:#EAF3DE;color:#3B6D11}
.badge.todo{background:#E6F1FB;color:#185FA5}
.badge.waiting{background:#FBEAF0;color:#993556}
.task-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--color-text-secondary);align-items:center}
.task-meta i{font-size:13px;vertical-align:-2px;margin-right:3px}
.subtask-wrap{margin-top:10px;border-top:0.5px solid var(--color-border-tertiary);padding-top:10px;display:none}
.subtask-wrap.open{display:block}
.subtask{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--color-text-secondary)}
.subtask input[type=checkbox]{accent-color:#185FA5;width:15px;height:15px;cursor:pointer;flex-shrink:0}
.subtask-title{flex:1}
.subtask-title.done-txt{text-decoration:line-through}
.sub-progress{height:4px;background:var(--color-border-tertiary);border-radius:2px;margin-top:6px;overflow:hidden}
.sub-progress-fill{height:100%;background:#185FA5;border-radius:2px;transition:width .3s}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-secondary);padding:1.5rem;width:100%;max-width:520px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1rem;color:var(--color-text-primary)}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem}
.filter-bar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-bar select{font-size:12px;padding:5px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.empty{text-align:center;padding:3rem 1rem;color:var(--color-text-secondary);font-size:14px}
.proj-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary)}
.overdue-warn{display:flex;align-items:center;gap:8px;background:#FCEBEB;border:0.5px solid #F0959580;border-radius:var(--border-radius-md);padding:.6rem 1rem;margin-bottom:1rem;font-size:13px;color:#A32D2D}
</style>

<h2 class="sr-only">ระบบจัดการงานและโปรเจคสำหรับทีมออฟฟิศ</h2>
<div class="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <h1><i class="ti ti-layout-kanban" aria-hidden="true" style="font-size:20px;vertical-align:-3px;margin-right:6px"></i>Task Board</h1>
      <div class="tabs" id="proj-tabs"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="openNewProj()"><i class="ti ti-folder-plus" aria-hidden="true"></i> โปรเจคใหม่</button>
      <button class="btn primary" onclick="openNewTask()"><i class="ti ti-plus" aria-hidden="true"></i> เพิ่มงาน</button>
    </div>
  </div>

  <div class="summary-bar" id="summary-bar"></div>
  <div id="overdue-banner"></div>
  <div class="filter-bar">
    <span style="font-size:12px;color:var(--color-text-secondary)">กรองตามสถานะ:</span>
    <select id="filter-status" onchange="render()">
      <option value="">ทั้งหมด</option>
      <option value="todo">รอดำเนินการ</option>
      <option value="inprogress">กำลังทำ</option>
      <option value="waiting">รอผลตอบ</option>
      <option value="done">เสร็จแล้ว</option>
      <option value="overdue">เกินกำหนด</option>
    </select>
    <select id="filter-assign" onchange="render()">
      <option value="">ทุกคน</option>
    </select>
  </div>
  <div class="task-list" id="task-list"></div>
</div>

<div class="modal-bg" id="modal-bg" style="display:none">
  <div class="modal" id="modal"></div>
</div>

<script>
const MEMBERS = ['อาร์ต','บิ๊ก','นุ่น','เก่ง','แพร'];
const STATUS_LABEL = {todo:'รอดำเนินการ',inprogress:'กำลังทำ',done:'เสร็จแล้ว',waiting:'รอผลตอบ',overdue:'เกินกำหนด'};
const STATUS_BADGE = {todo:'todo',inprogress:'inprogress',done:'done',waiting:'waiting',overdue:'overdue'};

let projects = [
  {id:'p1',name:'Website Redesign',color:'#185FA5'},
  {id:'p2',name:'แคมเปญ Q3',color:'#993556'},
  {id:'p3',name:'ระบบ HR ใหม่',color:'#3B6D11'}
];

let tasks = [
  {id:'t1',pid:'p1',title:'ออกแบบ Mockup หน้าหลัก',client:'บริษัท ABC จำกัด',assign:'อาร์ต',start:'2026-05-10',due:'2026-05-15',status:'overdue',note:'ต้องส่งให้ลูกค้าอนุมัติก่อน',subtasks:[
    {id:'s1',title:'วาง wireframe',done:true},
    {id:'s2',title:'เลือก color scheme',done:true},
    {id:'s3',title:'ทำ hi-fi mockup',done:false}
  ]},
  {id:'t2',pid:'p1',title:'พัฒนา Frontend หน้า Landing',client:'บริษัท ABC จำกัด',assign:'บิ๊ก',start:'2026-05-16',due:'2026-05-30',status:'inprogress',note:'',subtasks:[
    {id:'s4',title:'HTML/CSS structure',done:true},
    {id:'s5',title:'Responsive mobile',done:false},
    {id:'s6',title:'Animation effects',done:false}
  ]},
  {id:'t3',pid:'p2',title:'ร่าง content โฆษณา Facebook',client:'ร้าน XYZ',assign:'นุ่น',start:'2026-05-18',due:'2026-05-25',status:'todo',note:'',subtasks:[
    {id:'s7',title:'research target audience',done:false},
    {id:'s8',title:'เขียน copy 5 ชุด',done:false}
  ]},
  {id:'t4',pid:'p2',title:'ถ่ายภาพสินค้า',client:'ร้าน XYZ',assign:'แพร',start:'2026-05-20',due:'2026-05-22',status:'inprogress',note:'นัดถ่ายที่สตูดิโอ',subtasks:[
    {id:'s9',title:'เตรียม props',done:true},
    {id:'s10',title:'ถ่ายภาพ',done:false},
    {id:'s11',title:'retouch',done:false}
  ]},
  {id:'t5',pid:'p3',title:'ประชุมเก็บ requirement',client:'ฝ่าย HR',assign:'เก่ง',start:'2026-05-12',due:'2026-05-13',status:'done',note:'',subtasks:[
    {id:'s12',title:'จัดทำ meeting agenda',done:true},
    {id:'s13',title:'บันทึก MOM',done:true}
  ]},
  {id:'t6',pid:'p3',title:'ออกแบบ DB schema',client:'ฝ่าย HR',assign:'บิ๊ก',start:'2026-05-14',due:'2026-05-18',status:'overdue',note:'รอ confirm จาก IT',subtasks:[
    {id:'s14',title:'ERD diagram',done:true},
    {id:'s15',title:'review กับ team',done:false},
    {id:'s16',title:'ส่ง final schema',done:false}
  ]}
];

let activePid = 'all';
let expandedTasks = new Set();

function today(){return new Date().toISOString().split('T')[0]}

function checkOverdue(){
  tasks.forEach(t=>{
    if(t.status!=='done' && t.due && t.due < today()) t.status='overdue';
  });
}

function getFilteredTasks(){
  const st = document.getElementById('filter-status').value;
  const as = document.getElementById('filter-assign').value;
  return tasks.filter(t=>{
    if(activePid!=='all' && t.pid!==activePid) return false;
    if(st && t.status!==st) return false;
    if(as && t.assign!==as) return false;
    return true;
  });
}

function renderTabs(){
  const el = document.getElementById('proj-tabs');
  const allOverdue = tasks.some(t=>t.status==='overdue');
  el.innerHTML = `<button class="tab ${activePid==='all'?'active':''}" onclick="setProject('all')">ทั้งหมด<span class="dot ${allOverdue?'show':''}"></span></button>`;
  projects.forEach(p=>{
    const od = tasks.some(t=>t.pid===p.id && t.status==='overdue');
    el.innerHTML += `<button class="tab ${activePid===p.id?'active':''}" onclick="setProject('${p.id}')">${p.name}<span class="dot ${od?'show':''}"></span></button>`;
  });
}

function renderSummary(){
  const filtered = activePid==='all'?tasks:tasks.filter(t=>t.pid===activePid);
  const total=filtered.length, done=filtered.filter(t=>t.status==='done').length;
  const overdue=filtered.filter(t=>t.status==='overdue').length;
  const inprog=filtered.filter(t=>t.status==='inprogress').length;
  document.getElementById('summary-bar').innerHTML=`
    <div class="stat"><div class="stat-label">งานทั้งหมด</div><div class="stat-val">${total}</div></div>
    <div class="stat"><div class="stat-label">กำลังทำ</div><div class="stat-val amber">${inprog}</div></div>
    <div class="stat"><div class="stat-label">เสร็จแล้ว</div><div class="stat-val green">${done}</div></div>
    <div class="stat"><div class="stat-label">เกินกำหนด</div><div class="stat-val red">${overdue}</div></div>
  `;
  const banner = document.getElementById('overdue-banner');
  if(overdue>0){
    banner.innerHTML=`<div class="overdue-warn"><i class="ti ti-alert-triangle" style="font-size:16px" aria-hidden="true"></i> มีงาน <strong>${overdue} รายการ</strong> ที่เกินกำหนดส่งแล้ว กรุณาตรวจสอบด่วน!</div>`;
  } else banner.innerHTML='';
}

function renderAssignFilter(){
  const sel = document.getElementById('filter-assign');
  const cur = sel.value;
  sel.innerHTML = '<option value="">ทุกคน</option>';
  MEMBERS.forEach(m=>{ sel.innerHTML+=`<option value="${m}" ${cur===m?'selected':''}>${m}</option>`; });
}

function subProgress(subtasks){
  if(!subtasks||!subtasks.length) return '';
  const done=subtasks.filter(s=>s.done).length;
  const pct=Math.round(done/subtasks.length*100);
  return `<div class="sub-progress"><div class="sub-progress-fill" style="width:${pct}%"></div></div>`;
}

function render(){
  checkOverdue();
  renderTabs();
  renderSummary();
  renderAssignFilter();
  const list = document.getElementById('task-list');
  const filtered = getFilteredTasks();
  if(!filtered.length){list.innerHTML='<div class="empty"><i class="ti ti-mood-happy" style="font-size:32px;display:block;margin-bottom:8px" aria-hidden="true"></i>ไม่มีงานในขณะนี้</div>';return;}
  list.innerHTML = filtered.map(t=>{
    const proj = projects.find(p=>p.id===t.pid)||{name:'-',color:'#888'};
    const expanded = expandedTasks.has(t.id);
    const subsDone = t.subtasks?t.subtasks.filter(s=>s.done).length:0;
    const subsTotal = t.subtasks?t.subtasks.length:0;
    const subsHtml = t.subtasks&&t.subtasks.length ? t.subtasks.map(s=>`
      <div class="subtask">
        <input type="checkbox" ${s.done?'checked':''} onchange="toggleSub('${t.id}','${s.id}',this.checked)" />
        <span class="subtask-title ${s.done?'done-txt':''}">${s.title}</span>
      </div>`).join(''):'<div style="font-size:12px;color:var(--color-text-secondary);padding:4px 0">ยังไม่มี subtask</div>';
    return `<div class="task-card ${t.status}" id="card-${t.id}">
      <div class="task-header">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">
            <span class="badge ${STATUS_BADGE[t.status]}">${STATUS_LABEL[t.status]}</span>
            <span class="proj-badge" style="border-color:${proj.color}40;color:${proj.color}"><i class="ti ti-folder" style="font-size:11px" aria-hidden="true"></i>${proj.name}</span>
          </div>
          <div class="task-title ${t.status==='done'?'done-txt':''}">${t.title}</div>
        </div>
      </div>
      <div class="task-meta">
        <span><i class="ti ti-user" aria-hidden="true"></i>${t.assign}</span>
        <span><i class="ti ti-building-store" aria-hidden="true"></i>${t.client}</span>
        <span><i class="ti ti-calendar-event" aria-hidden="true"></i>เริ่ม ${t.start}</span>
        <span><i class="ti ti-calendar-due" aria-hidden="true"></i>ครบ ${t.due}</span>
        ${subsTotal?`<span><i class="ti ti-subtask" aria-hidden="true"></i>${subsDone}/${subsTotal} subtask</span>`:''}
      </div>
      ${subsTotal?subProgress(t.subtasks):''}
      ${t.note?`<div style="margin-top:8px;font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary);padding:5px 8px;border-radius:4px"><i class="ti ti-notes" style="font-size:13px;vertical-align:-2px" aria-hidden="true"></i> ${t.note}</div>`:''}
      <div class="subtask-wrap ${expanded?'open':''}" id="sub-${t.id}">
        ${subsHtml}
        <button class="btn" style="margin-top:8px;font-size:12px;padding:5px 10px" onclick="addSubtask('${t.id}')"><i class="ti ti-plus" aria-hidden="true"></i> เพิ่ม subtask</button>
      </div>
      <div class="actions">
        <button class="btn" style="font-size:12px;padding:5px 10px" onclick="toggleExpand('${t.id}')"><i class="ti ti-subtask" aria-hidden="true"></i> ${expanded?'ซ่อน':'ดู'} subtask</button>
        <button class="btn" style="font-size:12px;padding:5px 10px" onclick="openEdit('${t.id}')"><i class="ti ti-edit" aria-hidden="true"></i> แก้ไข</button>
        <select style="font-size:12px;padding:4px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer" onchange="changeStatus('${t.id}',this.value)">
          <option value="">เปลี่ยนสถานะ...</option>
          ${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <button class="btn danger" style="font-size:12px;padding:5px 10px;margin-left:auto" onclick="deleteTask('${t.id}')"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
    </div>`;
  }).join('');
}

function toggleExpand(id){
  if(expandedTasks.has(id)) expandedTasks.delete(id); else expandedTasks.add(id);
  render();
}

function toggleSub(tid,sid,val){
  const t=tasks.find(t=>t.id===tid);
  const s=t.subtasks.find(s=>s.id===sid);
  s.done=val;
  render();
}

function changeStatus(tid,val){
  if(!val)return;
  tasks.find(t=>t.id===tid).status=val;
  render();
}

function deleteTask(id){
  tasks=tasks.filter(t=>t.id!==id);
  render();
}

function setProject(pid){activePid=pid;render()}

function closeModal(){document.getElementById('modal-bg').style.display='none'}

function openNewTask(prefill={}){
  const m=document.getElementById('modal');
  m.innerHTML=`<h2><i class="ti ti-plus" aria-hidden="true" style="font-size:18px;vertical-align:-2px;margin-right:6px"></i>เพิ่มงานใหม่</h2>
  <div class="field"><label>ชื่องาน</label><input id="f-title" placeholder="ระบุชื่องาน..." value="${prefill.title||''}"/></div>
  <div class="field"><label>โปรเจค</label><select id="f-pid">${projects.map(p=>`<option value="${p.id}" ${prefill.pid===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>
  <div class="field"><label>ลูกค้า / ผู้ว่าจ้าง</label><input id="f-client" placeholder="ชื่อลูกค้าหรือหน่วยงาน" value="${prefill.client||''}"/></div>
  <div class="field"><label>ผู้รับผิดชอบ</label><select id="f-assign">${MEMBERS.map(m=>`<option value="${m}" ${prefill.assign===m?'selected':''}>${m}</option>`).join('')}</select></div>
  <div class="field-row">
    <div class="field"><label>วันเริ่มงาน</label><input type="date" id="f-start" value="${prefill.start||today()}"/></div>
    <div class="field"><label>วันครบกำหนด</label><input type="date" id="f-due" value="${prefill.due||''}"/></div>
  </div>
  <div class="field"><label>สถานะ</label><select id="f-status">${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}" ${(prefill.status||'todo')===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="field"><label>หมายเหตุ</label><textarea id="f-note" placeholder="รายละเอียดเพิ่มเติม...">${prefill.note||''}</textarea></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">ยกเลิก</button>
    <button class="btn primary" onclick="saveNewTask()"><i class="ti ti-check" aria-hidden="true"></i> บันทึก</button>
  </div>`;
  document.getElementById('modal-bg').style.display='flex';
}

function saveNewTask(){
  const title=document.getElementById('f-title').value.trim();
  if(!title) return alert('กรุณาระบุชื่องาน');
  const id='t'+Date.now();
  tasks.push({id,pid:document.getElementById('f-pid').value,title,client:document.getElementById('f-client').value,assign:document.getElementById('f-assign').value,start:document.getElementById('f-start').value,due:document.getElementById('f-due').value,status:document.getElementById('f-status').value,note:document.getElementById('f-note').value,subtasks:[]});
  closeModal();render();
}

function openEdit(tid){
  const t=tasks.find(t=>t.id===tid);
  openNewTask(t);
  document.querySelector('.modal .btn.primary').setAttribute('onclick','saveEdit("'+tid+'")');
  document.querySelector('.modal h2').innerHTML='<i class="ti ti-edit" aria-hidden="true" style="font-size:18px;vertical-align:-2px;margin-right:6px"></i>แก้ไขงาน';
}

function saveEdit(tid){
  const t=tasks.find(t=>t.id===tid);
  t.pid=document.getElementById('f-pid').value;
  t.title=document.getElementById('f-title').value.trim();
  t.client=document.getElementById('f-client').value;
  t.assign=document.getElementById('f-assign').value;
  t.start=document.getElementById('f-start').value;
  t.due=document.getElementById('f-due').value;
  t.status=document.getElementById('f-status').value;
  t.note=document.getElementById('f-note').value;
  closeModal();render();
}

function addSubtask(tid){
  const m=document.getElementById('modal');
  m.innerHTML=`<h2><i class="ti ti-subtask" aria-hidden="true" style="font-size:18px;vertical-align:-2px;margin-right:6px"></i>เพิ่ม Subtask</h2>
  <div class="field"><label>ชื่อ Subtask</label><input id="sub-inp" placeholder="ระบุ subtask..."/></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">ยกเลิก</button>
    <button class="btn primary" onclick="saveSubtask('${tid}')"><i class="ti ti-check" aria-hidden="true"></i> บันทึก</button>
  </div>`;
  document.getElementById('modal-bg').style.display='flex';
  setTimeout(()=>document.getElementById('sub-inp').focus(),100);
}

function saveSubtask(tid){
  const val=document.getElementById('sub-inp').value.trim();
  if(!val)return;
  tasks.find(t=>t.id===tid).subtasks.push({id:'s'+Date.now(),title:val,done:false});
  expandedTasks.add(tid);
  closeModal();render();
}

function openNewProj(){
  const m=document.getElementById('modal');
  m.innerHTML=`<h2><i class="ti ti-folder-plus" aria-hidden="true" style="font-size:18px;vertical-align:-2px;margin-right:6px"></i>โปรเจคใหม่</h2>
  <div class="field"><label>ชื่อโปรเจค</label><input id="pname" placeholder="ชื่อโปรเจค..."/></div>
  <div class="modal-footer">
    <button class="btn" onclick="closeModal()">ยกเลิก</button>
    <button class="btn primary" onclick="saveProj()"><i class="ti ti-check" aria-hidden="true"></i> สร้าง</button>
  </div>`;
  document.getElementById('modal-bg').style.display='flex';
  setTimeout(()=>document.getElementById('pname').focus(),100);
}

function saveProj(){
  const name=document.getElementById('pname').value.trim();
  if(!name)return;
  const colors=['#185FA5','#993556','#3B6D11','#854F0B','#533DB7'];
  projects.push({id:'p'+Date.now(),name,color:colors[projects.length%colors.length]});
  closeModal();render();
}

document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});
render();
</script>
